name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint → Typecheck → Unit → Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared (path alias prerequisite)
        run: npm run build --workspace @sofo/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build API + Web
        run: npm run build

      - name: Upload web dist (packaging artifact)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  smoke:
    name: E2E smoke (HTTP + Realtime)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sofo
          POSTGRES_PASSWORD: sofo_dev
          POSTGRES_DB: sofo
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sofo:sofo_dev@localhost:5433/sofo?schema=public
      PORT: 4001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared + API
        run: |
          npm run build --workspace @sofo/shared
          npm run build --workspace @sofo/api

      - name: Apply Prisma migrations
        run: npm run prisma:deploy --workspace @sofo/api

      - name: Start API server
        run: |
          npm run start --workspace @sofo/api &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/api/v1/health && break
            sleep 1
          done

      - name: HTTP smoke tests
        run: node apps/api/test/http-smoke.mjs

      - name: Realtime smoke tests
        run: node apps/api/test/realtime-smoke.mjs

      