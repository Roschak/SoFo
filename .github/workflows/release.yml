name: Release

# Builds the physical binaries without any local toolchain:
#  - Windows EXE (Tauri 2 installer) on a windows runner
#  - Android APK (Capacitor debug APK) on an ubuntu runner (SDK preinstalled)
# Trigger: manual dispatch or version tag push (e.g. v0.1.0).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  exe:
    name: Windows EXE (Tauri 2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain (runner-managed)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build shared + web
        run: |
          npm run build --workspace @sofo/shared
          npm run build --workspace @sofo/web

      - name: Build Tauri EXE
        working-directory: apps/web
        run: npx tauri build

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sofo-windows-exe
          path: |
            apps/web/src-tauri/target/release/bundle/nsis/*.exe
            apps/web/src-tauri/target/release/sofo*.exe
          retention-days: 14

  apk:
    name: Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build shared + web
        run: |
          npm run build --workspace @sofo/shared
          npm run build --workspace @sofo/web

      - name: Sync Capacitor assets
        working-directory: apps/web
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sofo-android-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
