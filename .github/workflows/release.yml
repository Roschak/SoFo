name: Release

# Builds the physical binaries without any local toolchain:
#  - Windows EXE (Tauri 2 installer) on a windows runner
#  - Android APK (Capacitor debug APK) on an ubuntu runner (SDK preinstalled)
# Trigger: manual dispatch or version tag push (e.g. v0.1.0).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  exe:
    name: Windows EXE (Tauri 2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain (runner-managed)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build shared + web
        run: |
          npm run build --workspace @sofo/shared
          npm run build --workspace @sofo/web

      - name: Build Tauri EXE
        working-directory: apps/web
        run: npx tauri build

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sofo-windows-exe
          path: |
            apps/web/src-tauri/target/release/bundle/nsis/*.exe
            apps/web/src-tauri/target/release/sofo*.exe
          retention-days: 14

  apk:
    name: Android APK (signed release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build shared + web
        run: |
          npm run build --workspace @sofo/shared
          npm run build --workspace @sofo/web

      - name: Sync Capacitor assets
        working-directory: apps/web
        run: npx cap sync android

      - name: Restore signing keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo '::warning::ANDROID_KEYSTORE_B64 not set — building unsigned release APK'
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/sofo-release.jks
          cat > apps/web/android/keystore.properties <<EOF
          storeFile=/tmp/sofo-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK (signed when keystore present)
        working-directory: apps/web/android
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sofo-android-apk-release
          path: apps/web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sofo-android-apk-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: ignore
