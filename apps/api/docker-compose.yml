services:
  db:
    image: postgres:16-alpine
    container_name: sofo-db
    environment:
      POSTGRES_USER: sofo
      POSTGRES_PASSWORD: sofo_dev
      POSTGRES_DB: sofo
    ports:
      - '5432:5432'
    volumes:
      - sofo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sofo -d sofo']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sofo_pgdata:
